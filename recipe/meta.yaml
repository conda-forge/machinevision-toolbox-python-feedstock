{% set name = "machinevision-toolbox-python" %}
{% set version = "2.0.1" %}
{% set python_min = "3.10" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  - url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name.replace('-', '_') }}-{{ version }}.tar.gz
    sha256: aaa26071787c85b907ef1137c2191996f1c69da2f42d0dff121d9f355e096c9f

build:
  noarch: python
  script: echo "${PKG_VERSION}" > RELEASE && {{ PYTHON }} -m pip install . -vv
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - pip
    - setuptools
    - hatchling
  run:
    - python >={{ python_min }}
    - numpy
    - scipy
    - matplotlib-base
    - py-opencv
    - spatialmath-python
    - pgraph-python
    - ansitable
    - mvtb-data
    - arm_pyart
    - open3d
    - tqdm
    - ipywidgets
    - ipympl
    - open3d
    - rosbags
    - roslibpy
    - websockets
    - tqdm
    - pillow

test:
  requires:
    - python {{ python_min }}
  imports:
    - machinevisiontoolbox
  # fails because of opencv-contrib-python
  # commands:
  #   - pip check
  # requires:
  #   - pip

about:
  home: https://github.com/petercorke/machinevision-toolbox-python
  summary: A machine vision for education and research
  dev_url: https://github.com/petercorke/machinevision-toolbox-python
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - Tobias-Fischer
