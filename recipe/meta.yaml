{% set name = "machinevision-toolbox-python" %}
{% set version = "1.0.2" %}
{% set python_min = "3.10" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  - url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name.replace('-', '_') }}-{{ version }}.tar.gz
    sha256: 926b972e49482e6eb9292631fd7f922ecc8f9b6504928ee40ad029fe0e1c8aa4

build:
  noarch: python
  script: echo "${PKG_VERSION}" > RELEASE && {{ PYTHON }} -m pip install . -vv
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - pip
    - setuptools
  run:
    - python >={{ python_min }}
    - numpy <2
    - scipy
    - matplotlib-base
    - py-opencv
    - spatialmath-python
    - pgraph-python
    - ansitable
    - mvtb-data
    - arm_pyart
    - open3d

test:
  requires:
    - python {{ python_min }}
  imports:
    - machinevisiontoolbox
  # fails because of opencv-contrib-python
  # commands:
  #   - pip check
  # requires:
  #   - pip

about:
  home: https://github.com/petercorke/machinevision-toolbox-python
  summary: A machine vision for education and research
  dev_url: https://github.com/petercorke/machinevision-toolbox-python
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - Tobias-Fischer
