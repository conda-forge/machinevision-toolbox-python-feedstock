{% set name = "machinevision-toolbox-python" %}
{% set version = "2.4.0" %}
{% set python_min = "3.10" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  - url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/{{ name.replace('-', '_') }}-{{ version }}.tar.gz
    sha256: 1a34f32de127b3827f5be449d83d9284632a4efaf9980d3a0f1aa2d1703fd4b1

build:
  noarch: python
  script: echo "${PKG_VERSION}" > RELEASE && {{ PYTHON }} -m pip install . -vv
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - pip
    - setuptools
    - hatchling
  run:
    - python >={{ python_min }}
    - numpy
    - scipy
    - matplotlib-base
    - py-opencv
    - spatialmath-python
    - pgraph-python
    - ansitable
    - mvtb-data
    - arm_pyart
    - open3d
    - tqdm
    - ipywidgets
    - ipympl
    - open3d
    - rosbags
    - roslibpy
    - websockets
    - tqdm
    - pillow

test:
  requires:
    - python {{ python_min }}
  imports:
    - machinevisiontoolbox
  # fails because of opencv-contrib-python
  # commands:
  #   - pip check
  # requires:
  #   - pip

about:
  home: https://github.com/petercorke/machinevision-toolbox-python
  summary: A machine vision for education and research
  dev_url: https://github.com/petercorke/machinevision-toolbox-python
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - Tobias-Fischer
